<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}College Feedback System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="wrap bar">
    <strong>College Feedback System</strong>
    <nav>
      {% if g.user %}
        <span>{{ g.user.name }} ({{ g.user.role }})</span>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link">Logout</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, text in messages %}<div class="flash {{ category }}">{{ text }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
